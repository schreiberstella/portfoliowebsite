<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Illustration – Stella Schreiber</title>
  <meta name="description" content="Illustrationen von Stella Schreiber.">
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="kopf">
    <a class="logo" href="index.html#portfolio" aria-label="Stella Schreiber – Startseite">
      <img src="logo.png" alt="">
      <span>Stella<br>Schreiber</span>
    </a>
    <button class="burger" id="menueAuf" type="button" aria-label="Menü öffnen" aria-expanded="false" aria-controls="menue">
      <i></i><i></i><i></i>
    </button>
  </header>

  <div class="scrim" id="scrim"></div>
  <nav class="menue" id="menue" aria-label="Bereiche">
    <button class="menue-zu" id="menueZu" type="button" aria-label="Menü schließen"></button>
    <ul>
      <li><a href="animation.html">Animation</a></li>
      <li><a href="illustration.html" aria-current="page">Illustration</a></li>
      <li><a href="fotografie.html">Fotografie</a></li>
      <li><a href="grafik-design.html">Grafik Design</a></li>
    </ul>
  </nav>

  <main class="seite illu-seite">
    <style>
      /* ===== Illustration: großes Bild rechts, Überschrift und kleiner Titel links daneben ===== */
      .illu-seite { max-width: 1400px; padding-bottom: 2rem; }
      .illu-layout { display: grid; grid-template-columns: minmax(0, 1fr) min(58%, calc((100vh - 190px) * 0.74)); grid-template-columns: minmax(0, 1fr) min(58%, calc((100svh - 190px) * 0.74)); column-gap: clamp(1rem, 2.4vw, 2rem); align-items: stretch; }
      .illu-links { display: flex; flex-direction: column; justify-content: space-between; min-height: 100%; }
      .illu-links .seite-titel { margin: clamp(1rem, 6vh, 3.2rem) 0 0; }
      .illu-info { text-align: right; }
      .illu-info .galerie-name { margin: 0; font-size: .8rem; line-height: 1.25; }
      .illu-info .bild-zaehler { margin: .5rem 0 0; font-size: .7rem; }
      .illu-slider { align-self: start; }
      .illu-slider .spur { transition: height .25s ease; }
      .illu-layout .folie { align-items: flex-start; }
      .illu-layout .folie img { max-height: calc(100vh - 190px); max-height: calc(100svh - 190px); min-height: 0; margin: 0 auto; }
      .illu-layout .pfeil { top: 50%; }
      @media (max-width: 819px) {
        .illu-layout { display: block; }
        .illu-links { display: block; min-height: 0; }
        .illu-links .seite-titel { margin: 0 0 1rem; }
        .illu-info { text-align: left; margin-top: .8rem; }
        .illu-layout .folie img { max-height: calc(100svh - 230px); }
        .illu-slider { margin-top: 0; }
      }
    </style>
    <a class="zurueck" href="index.html#portfolio">&larr; Startseite</a>

    <!-- Die Illustrationen stehen in der Datei projekte.js -->
    <div class="illu-layout" id="illustrationGalerie" data-bereich="illustration">
      <div class="illu-links">
        <h1 class="seite-titel">Illustration</h1>
        <div class="illu-info">
          <p class="galerie-name" id="galerieName" aria-live="polite"></p>
          <p class="bild-zaehler" id="galerieZaehler"></p>
        </div>
      </div>
      <div class="slider illu-slider">
        <div class="spur" id="galerieSpur" tabindex="0" aria-label="Illustrationen"></div>
        <button class="pfeil pfeil-links" id="galerieVor" type="button" aria-label="Vorige Illustration"></button>
        <button class="pfeil pfeil-rechts" id="galerieWeiter" type="button" aria-label="Nächste Illustration"></button>
      </div>
    </div>
    <noscript><p class="hinweis">Für diese Seite wird JavaScript benötigt.</p></noscript>
    <script>
      /* Die Fläche passt sich dem gerade gezeigten Bild an, damit oben und unten keine weiße Fläche bleibt */
      (function () {
        var sp = document.getElementById('galerieSpur');
        function fit() {
          var i = Math.round(sp.scrollLeft / Math.max(sp.clientWidth, 1));
          var f = sp.children[i]; var im = f && f.querySelector('img');
          if (im && im.clientHeight) sp.style.height = im.clientHeight + 'px';
        }
        sp.addEventListener('scroll', fit, { passive: true });
        sp.addEventListener('load', fit, true);
        window.addEventListener('resize', fit);
        window.addEventListener('load', fit);
        window.addEventListener('pageshow', fit);
        setTimeout(fit, 200); setTimeout(fit, 800);
      })();
    </script>
  </main>

  <footer class="fuss">
    <p>&copy; 2026 Stella Schreiber</p>
  </footer>

  <script src="projekte.js"></script>
  <script src="script.js"></script>
</body>
</html>
